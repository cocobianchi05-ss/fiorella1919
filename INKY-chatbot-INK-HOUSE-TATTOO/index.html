<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INKY · Asistente virtual de INK HOUSE TATTOO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     INK HOUSE TATTOO · INKY CHATBOT
     Paleta: carbón + rojo tinta + dorado stamp sobre papel hueso
     ============================================================ */
  :root{
    --charcoal: #141312;
    --charcoal-2: #1c1a19;
    --ink-red: #c8232b;
    --ink-red-dim: #7c1a1f;
    --gold: #b6893f;
    --bone: #ece5d8;
    --bone-dim: #a9a099;
    --line: #302c29;
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #201d1b 0%, var(--charcoal) 55%),
      var(--charcoal);
    font-family:'Work Sans', sans-serif;
    color:var(--bone);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:440px;
    height:min(720px, 92vh);
    background:var(--charcoal-2);
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    position:relative;
  }
  /* textura sutil tipo papel de flash */
  .app::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative; z-index:1;
    padding:18px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(180deg, rgba(200,35,43,0.08), transparent);
  }
  .avatar{
    width:42px; height:42px;
    border-radius:50%;
    border:2px solid var(--ink-red);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    background:var(--charcoal);
  }
  .avatar svg{width:22px;height:22px;stroke:var(--ink-red);}
  .header-text{flex:1; min-width:0;}
  .header-text .name{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--bone);
    line-height:1.1;
  }
  .header-text .status{
    font-size:12px;
    color:var(--bone-dim);
    display:flex; align-items:center; gap:6px;
    margin-top:2px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#4caf50;display:inline-block;box-shadow:0 0 0 2px rgba(76,175,80,0.2);}
  .studio-mark{
    font-family:'Oswald', sans-serif;
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid var(--gold);
    padding:4px 8px;
    border-radius:3px;
    flex-shrink:0;
  }

  .messages{
    position:relative; z-index:1;
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .msg{
    max-width:82%;
    padding:10px 13px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.45;
    white-space:pre-wrap;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .msg.bot{
    align-self:flex-start;
    background:var(--charcoal);
    border:1px solid var(--line);
    border-top-left-radius:0;
    color:var(--bone);
  }
  .msg.user{
    align-self:flex-end;
    background:var(--ink-red);
    border-top-right-radius:0;
    color:#fff;
    font-weight:500;
  }
  .msg.bot b{color:var(--gold);}

  .typing{
    align-self:flex-start;
    display:flex; gap:4px;
    padding:12px 14px;
    background:var(--charcoal);
    border:1px solid var(--line);
    border-radius:var(--radius);
    border-top-left-radius:0;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--bone-dim);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .quick-replies{
    position:relative; z-index:1;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:4px 16px 14px;
    flex-shrink:0;
  }
  .chip{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    background:transparent;
    color:var(--bone);
    border:1px solid var(--line);
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s, color .15s, transform .1s;
  }
  .chip:hover{border-color:var(--ink-red); color:#fff; transform:translateY(-1px);}
  .chip:active{transform:translateY(0);}

  form.composer{
    position:relative; z-index:1;
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--line);
    background:var(--charcoal-2);
    flex-shrink:0;
  }
  form.composer input{
    flex:1;
    background:var(--charcoal);
    border:1px solid var(--line);
    border-radius:20px;
    padding:10px 16px;
    color:var(--bone);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    outline:none;
  }
  form.composer input:focus{border-color:var(--ink-red);}
  form.composer input::placeholder{color:var(--bone-dim);}
  form.composer button{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--ink-red);
    color:#fff;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:background .15s;
  }
  form.composer button:hover{background:#a91e25;}
  form.composer button svg{width:17px;height:17px;}

  .wa-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    background:#25D366;
    color:#0b1a10;
    font-weight:600;
    font-size:13px;
    padding:9px 14px;
    border-radius:20px;
    text-decoration:none;
    align-self:flex-start;
    width:fit-content;
  }

  @media (max-width:480px){
    body{padding:0;}
    .app{max-width:100%; height:100vh; border-radius:0; border:none;}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 15c0-4 2-6 6-6s6 2 6 6"/><circle cx="12" cy="7" r="2.5"/><path d="M4 19h16"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="name">INKY</div>
      <div class="status"><span class="dot"></span>Asistente virtual · en línea</div>
    </div>
    <div class="studio-mark">Ink House<br>Tattoo</div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="quick-replies" id="quickReplies"></div>

  <form class="composer" id="composer">
    <input type="text" id="userInput" placeholder="Escribí tu consulta…" autocomplete="off">
    <button type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>

<script>
/* ================================================================
   CONFIGURACIÓN DEL ESTUDIO
   Completar estos datos reales antes de publicar el chatbot.
   INKY nunca inventa esta información: si un campo queda vacío,
   se lo indica al cliente y deriva la consulta al tatuador.
   ================================================================ */
const CONFIG = {
  direccion: "",              // Ej: "Av. Siempre Viva 1234, Bragado, Buenos Aires"
  horarios: "",                // Ej: "Martes a sábado, de 11 a 19 hs"
  mediosDePago: "",             // Ej: "Efectivo, transferencia y tarjetas de débito/crédito"
  telefonoWhatsapp: "",         // Solo números con código de país, ej: "5492352123456"
  instagram: "",                // Ej: "@inkhousetattoo"
};

/* ================================================================
   ESTADO DE LA CONVERSACIÓN
   ================================================================ */
const state = {
  mode: "menu",       // "menu" | "turno"
  turnoStep: 0,
  turno: {}
};

const TURNO_PREGUNTAS = [
  { key: "nombre",     texto: "¡Buenísimo! ✍️ Para arrancar, decime tu *nombre*." },
  { key: "contacto",    texto: "Perfecto. Ahora pasame un *teléfono o medio de contacto* (WhatsApp, Instagram, etc.)." },
  { key: "tatuaje",     texto: "¿Qué *tatuaje* tenés pensado hacerte? Contame la idea (podés mandar referencias cuando confirmemos por WhatsApp)." },
  { key: "tamano",      texto: "¿Qué *tamaño* aproximado tiene en mente? (chico, mediano o grande, o si tenés medidas en cm mejor todavía)." },
  { key: "zona",        texto: "¿En qué *zona del cuerpo* iría el tatuaje?" },
  { key: "fecha",       texto: "¿Tenés alguna *fecha preferida* para el turno?" },
  { key: "detalle",     texto: "Último paso 🙌 ¿Algún *detalle adicional* que quieras contarnos? Si no hay nada más, escribí \"no\"." }
];

/* ================================================================
   RESPUESTAS POR TEMA
   ================================================================ */
const RESPUESTAS = {
  precios: () =>
    "💰 El precio de un tatuaje depende de varios factores: el *tamaño*, la *complejidad del diseño*, la *zona del cuerpo* y el *tiempo de trabajo* que requiera.\n\nPara darte un presupuesto certero, lo ideal es que nos cuentes tu idea al sacar el turno y el tatuador lo evalúa. ¿Querés que arranquemos con eso?",

  disenos: () =>
    "🎨 ¡Trabajamos con *diseños 100% personalizados*! Podés mandarnos tu idea, alguna referencia o inspiración, y el tatuador la desarrolla con vos hasta llegar al diseño final.\n\n¿Querés que te cuente cómo es el proceso completo o pasamos directo a sacar el turno?",

  proceso_diseno: () =>
    "🖌️ El proceso de un diseño personalizado suele ser así:\n1. Nos contás tu idea, estilo y zona del cuerpo.\n2. El tatuador prepara una propuesta de diseño.\n3. Ajustamos detalles con vos antes del día del turno.\n4. ¡Tatuaje! Con el diseño ya aprobado.\n\n¿Arrancamos sacando el turno?",

  tamanos: () =>
    "📏 Manejamos tres rangos orientativos:\n• *Pequeño*: diseños simples, pocos detalles.\n• *Mediano*: más elementos o sombreado.\n• *Grande*: piezas grandes, con mucho detalle o que cubren una zona amplia.\n\nEl tatuador puede confirmarte el tamaño ideal según tu idea y la zona elegida.",

  zonas: () =>
    "📍 Se puede tatuar prácticamente cualquier zona del cuerpo: brazo, antebrazo, pierna, espalda, pecho, costillas, manos, etc. Algunas zonas son más sensibles o requieren más cuidado en la cicatrización.\n\nSi me contás qué zona tenés en mente, lo anotamos para que el tatuador te oriente al confirmar el turno.",

  duracion: () =>
    "⏱️ La duración de la sesión depende del *tamaño* y la *complejidad* del tatuaje. Los diseños chicos pueden llevar menos de una hora, mientras que las piezas grandes o muy detalladas pueden necesitar varias sesiones.\n\nEl tatuador te da un estimado más preciso una vez que ve tu idea.",

  cuidados: () =>
    "🧴 Algunas recomendaciones generales:\n\n*Antes:*\n• Descansá bien y comé antes de venir.\n• Evitá el alcohol el día anterior.\n• Vení con la zona limpia.\n\n*Después:*\n• Mantené el tatuaje limpio y seco las primeras horas.\n• Usá la crema que te recomiende el tatuador.\n• Evitá sol, pileta y mar hasta que cicatrice.\n• No te rasques ni despegues las costras.\n\nEl tatuador te va a dar indicaciones específicas el día de tu sesión. 💪",

  pago: () => {
    if (!CONFIG.mediosDePago) {
      return "💳 Todavía no tengo cargados los medios de pago del estudio. Dejo tu consulta para que te confirme el tatuador directamente. 🙌";
    }
    return `💳 Los medios de pago disponibles son: ${CONFIG.mediosDePago}.`;
  },

  retoques: () =>
    "🔁 Los retoques se evalúan caso a caso, según cómo cicatrizó el tatuaje. Te recomendamos consultarlo directamente con tu tatuador después de la sesión para coordinarlo. 🙌",

  ubicacion_horarios: () => {
    let partes = [];
    if (CONFIG.direccion) partes.push(`📍 Nos encontrás en: ${CONFIG.direccion}.`);
    else partes.push("📍 Todavía no tengo cargada la dirección exacta del estudio.");
    if (CONFIG.horarios) partes.push(`🕒 Horarios de atención: ${CONFIG.horarios}.`);
    else partes.push("🕒 Todavía no tengo cargados los horarios de atención.");
    if (!CONFIG.direccion || !CONFIG.horarios) {
      partes.push("Para confirmarlo con exactitud, podemos dejar tu consulta para que la revise el estudio. 🙌");
    }
    return partes.join("\n");
  },

  disponibilidad: () =>
    "📅 Para consultar disponibilidad necesitamos algunos datos tuyos y así el tatuador puede confirmarte una fecha. ¿Arrancamos con la solicitud de turno?",

  fallback: () =>
    "🤔 Esa consulta puntual no la tengo cargada todavía. Para darte una respuesta precisa, podemos dejarla anotada para que la revise el tatuador. ¿Querés que la derive, o preferís ver alguna de las opciones del menú?"
};

/* ================================================================
   PALABRAS CLAVE PARA DETECTAR INTENCIÓN EN TEXTO LIBRE
   ================================================================ */
const KEYWORDS = [
  { tema: "precios",            palabras: ["precio","costo","cuanto sale","cuánto sale","vale","cotiza","presupuesto"] },
  { tema: "proceso_diseno",     palabras: ["proceso de diseño","como es el diseño","cómo es el diseño","como armamos el diseño"] },
  { tema: "disenos",            palabras: ["diseño","diseno","idea","referencia","boceto","personalizado"] },
  { tema: "tamanos",            palabras: ["tamaño","tamano","grande","mediano","chico","pequeño","pequeno","cm","centimetros","centímetros"] },
  { tema: "zonas",              palabras: ["zona","brazo","pierna","espalda","pecho","costilla","mano","cuello","tobillo","muñeca","muneca"] },
  { tema: "duracion",           palabras: ["cuanto tarda","cuánto tarda","duracion","duración","tiempo lleva","horas lleva"] },
  { tema: "cuidados",           palabras: ["cuidado","cicatriza","crema","despues del tatuaje","después del tatuaje","antes del tatuaje"] },
  { tema: "pago",               palabras: ["pago","efectivo","tarjeta","transferencia","seña","sena"] },
  { tema: "retoques",           palabras: ["retoque","retocar"] },
  { tema: "ubicacion_horarios", palabras: ["ubicacion","ubicación","direccion","dirección","donde queda","dónde queda","horario","atienden","abren"] },
  { tema: "disponibilidad",     palabras: ["disponibilidad","fecha libre","hay lugar","cuando pueden","cuándo pueden"] },
];

function detectarTema(texto){
  const t = texto.toLowerCase();
  for (const grupo of KEYWORDS){
    if (grupo.palabras.some(p => t.includes(p))) return grupo.tema;
  }
  if (/turno|reservar|sacar|agendar|cita/.test(t)) return "turno";
  return null;
}

/* ================================================================
   RENDERIZADO DE MENSAJES
   ================================================================ */
const messagesEl = document.getElementById("messages");
const quickRepliesEl = document.getElementById("quickReplies");

function scrollToBottom(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, from){
  const div = document.createElement("div");
  div.className = "msg " + from;
  div.innerHTML = formatText(text);
  messagesEl.appendChild(div);
  scrollToBottom();
}

function formatText(text){
  return text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*(.+?)\*/g, "<b>$1</b>");
}

function botReply(text, delay = 550){
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  messagesEl.appendChild(typing);
  scrollToBottom();
  return new Promise(resolve => {
    setTimeout(() => {
      typing.remove();
      addMessage(text, "bot");
      resolve();
    }, delay);
  });
}

function setQuickReplies(options){
  quickRepliesEl.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      addMessage(opt.label, "user");
      opt.action();
    });
    quickRepliesEl.appendChild(btn);
  });
}

const MENU_PRINCIPAL = [
  { label: "💰 Precios", action: () => runTopic("precios") },
  { label: "🎨 Diseños personalizados", action: () => runTopic("disenos") },
  { label: "📅 Sacar un turno", action: () => startTurno() },
  { label: "⏱️ Duración", action: () => runTopic("duracion") },
  { label: "🧴 Cuidados", action: () => runTopic("cuidados") },
  { label: "💳 Formas de pago", action: () => runTopic("pago") },
  { label: "📍 Ubicación y horarios", action: () => runTopic("ubicacion_horarios") },
  { label: "💬 Otra consulta", action: () => runOtraConsulta() },
];

async function runTopic(tema){
  state.mode = "menu";
  await botReply(RESPUESTAS[tema]());
  await botReply("¿Necesitás algo más?");
  setQuickReplies(MENU_PRINCIPAL);
}

async function runOtraConsulta(){
  state.mode = "menu";
  await botReply("Contame con tus palabras qué necesitás saber y hago lo posible por ayudarte 💬");
  setQuickReplies([]);
}

/* ================================================================
   FLUJO DE TURNO
   ================================================================ */
async function startTurno(){
  state.mode = "turno";
  state.turnoStep = 0;
  state.turno = {};
  setQuickReplies([]);
  await botReply("¡Genial, vamos a dejar tu solicitud de turno! Te voy a pedir algunos datos, uno por uno 📋");
  await askTurnoStep();
}

async function askTurnoStep(){
  const pregunta = TURNO_PREGUNTAS[state.turnoStep];
  await botReply(pregunta.texto);
}

async function handleTurnoAnswer(texto){
  const pregunta = TURNO_PREGUNTAS[state.turnoStep];
  state.turno[pregunta.key] = texto;
  state.turnoStep++;

  if (state.turnoStep < TURNO_PREGUNTAS.length){
    await askTurnoStep();
  } else {
    await finishTurno();
  }
}

async function finishTurno(){
  const t = state.turno;
  const resumen =
`Estos son los datos que registramos:

👤 Nombre: ${t.nombre}
📱 Contacto: ${t.contacto}
🖋️ Tatuaje: ${t.tatuaje}
📏 Tamaño: ${t.tamano}
📍 Zona: ${t.zona}
📅 Fecha preferida: ${t.fecha}
📝 Detalle adicional: ${t.detalle}`;

  await botReply(resumen, 400);
  await botReply("¡Listo! 🎉 Ya dejamos tu solicitud registrada. El estudio se va a poner en contacto para confirmarte la disponibilidad real.");

  const numero = CONFIG.telefonoWhatsapp;
  if (numero) {
    const mensaje = encodeURIComponent(
      `Hola! Quiero solicitar un turno en Ink House Tattoo.\nNombre: ${t.nombre}\nContacto: ${t.contacto}\nTatuaje: ${t.tatuaje}\nTamaño: ${t.tamano}\nZona: ${t.zona}\nFecha preferida: ${t.fecha}\nDetalle: ${t.detalle}`
    );
    const link = document.createElement("a");
    link.href = `https://wa.me/${numero}?text=${mensaje}`;
    link.target = "_blank";
    link.className = "wa-btn";
    link.textContent = "📲 Enviar por WhatsApp";
    messagesEl.appendChild(link);
    scrollToBottom();
  } else {
    await botReply("(Para que este botón envíe el resumen directo por WhatsApp, hay que cargar el número del estudio en la configuración del bot.)", 300);
  }

  state.mode = "menu";
  await botReply("¿Te ayudo con algo más?");
  setQuickReplies(MENU_PRINCIPAL);
}

/* ================================================================
   ENTRADA DE TEXTO LIBRE
   ================================================================ */
const composer = document.getElementById("composer");
const userInput = document.getElementById("userInput");

composer.addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = userInput.value.trim();
  if (!texto) return;
  addMessage(texto, "user");
  userInput.value = "";
  quickRepliesEl.innerHTML = "";

  if (state.mode === "turno"){
    await handleTurnoAnswer(texto);
    return;
  }

  const tema = detectarTema(texto);
  if (tema === "turno"){
    await startTurno();
  } else if (tema && RESPUESTAS[tema]){
    await runTopic(tema);
  } else {
    await botReply(RESPUESTAS.fallback());
    setQuickReplies(MENU_PRINCIPAL);
  }
});

/* ================================================================
   INICIO DE LA CONVERSACIÓN
   ================================================================ */
window.addEventListener("DOMContentLoaded", async () => {
  await botReply("¡Hola! 👋 Soy INKY, el asistente virtual de INK HOUSE TATTOO. Estoy acá para ayudarte con cualquier consulta sobre tatuajes, diseños y turnos. ¿Qué te gustaría saber?", 400);
  setQuickReplies(MENU_PRINCIPAL);
});
</script>
</body>
</html>
